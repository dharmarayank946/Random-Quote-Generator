<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Quote Generator - VEDA Technology Internship</title>
  <meta name="description" content="A clean, responsive Random Quote Generator built with HTML5, CSS3, and JavaScript." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">Random Quote Generator</h1>
      <p class="subtitle">Get a little inspiration with every click.</p>
    </header>

    <main class="quote-card">
      <div class="quote-icon" aria-hidden="true">&ldquo;</div>
      
      <blockquote class="quote-content">
        <p id="quote-text" class="quote-text">Click the button below to generate your first quote.</p>
      </blockquote>
      
      <div class="author-container">
        <span class="dash" aria-hidden="true">&mdash;</span>
        <span id="quote-author" class="quote-author">Author Name</span>
      </div>

      <div class="actions">
        <button id="new-quote-btn" class="btn btn-primary" type="button">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          New Quote
        </button>

        <button id="share-quote-btn" class="btn btn-secondary" type="button" aria-label="Share quote">
          <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/>
            <circle cx="6" cy="12" r="3"/>
            <circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
          Share Quote
        </button>
      </div>
    </main>

    <!-- Notification Toast for Copy/Share Feedback -->
    <div id="toast" class="toast" role="status" aria-live="polite" aria-hidden="true">
      <span id="toast-message">Quote copied to clipboard!</span>
    </div>

    <footer class="footer">
      <p>VEDA Technology Internship &bull; Task 8</p>
    </footer>
  </div>

  <!-- JavaScript logic -->
  <script src="script.js"></script>
</body>
</html>
